<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Awesome Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav><div id="logo"><h2>Logo</h2></div><div id="menu"><p><a href="index.html">Home</a></p><p><a href="about.html">About</a></p><p><a href="services.html">Services</a></p><p><a class="active" href="contact.html">Contact</a></p></div></nav>
    <main>
        <section class="section">
            <div class="section-heading"><h1>Let’s start a conversation</h1><p>Tell us about your idea, question, or project. We will get back to you soon.</p></div>
            <div class="contact-layout">
                <div class="contact-info">
                    <article class="contact-card"><h3>Email</h3><p><a href="mailto:hello@awesomewebsite.com">hello@awesomewebsite.com</a></p></article>
                    <article class="contact-card"><h3>Phone</h3><p><a href="tel:+911234567890">+91 12345 67890</a></p></article>
                    <article class="contact-card"><h3>Office hours</h3><p>Monday–Friday, 9:00 AM–5:00 PM</p></article>
                </div>
                <form class="contact-form" action="#" method="post">
                    <div><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Enter your name" required></div>
                    <div><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div>
                    <div><label for="message">Message</label><textarea id="message" name="message" placeholder="How can we help?" required></textarea></div>
                    <button type="submit">Send message</button>
                </form>
            </div>
        </section>
    </main>
    <footer>© 2026 Awesome Website. All rights reserved.</footer>
</body>
</html>
